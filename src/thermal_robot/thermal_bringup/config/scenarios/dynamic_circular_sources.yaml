name: dynamic_circular_sources
robot:
  spawn: {x: -6.0, y: 0.0}
sensor:
  fov_x_m: 4.0
  fov_y_m: 3.0
sources:
  - id: C1_loop
    xy: [-2.0, 2.5]
    amplitude: 30.0
    sigma_m: 1.0
    motion: circular
    motion_params: {center_x: -2.0, center_y: 2.5, radius_m: 1.1, angular_speed_rad_s: 0.035}
  - id: C2_static_far
    xy: [5.0, -3.5]
    amplitude: 23.0
    sigma_m: 0.9
    motion: static
  - id: C3_loop_weak
    xy: [-6.0, -4.0]
    amplitude: 17.0
    sigma_m: 0.85
    motion: circular
    motion_params: {center_x: -6.0, center_y: -4.0, radius_m: 0.8, angular_speed_rad_s: -0.045}
