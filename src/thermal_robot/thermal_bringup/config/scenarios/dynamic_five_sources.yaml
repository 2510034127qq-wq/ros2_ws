name: dynamic_five_sources
robot:
  spawn: {x: -6.0, y: 0.0}
sensor:
  fov_x_m: 4.0
  fov_y_m: 3.0
sources:
  - id: P1_waypoint
    xy: [-3.0, 2.0]
    amplitude: 30.0
    sigma_m: 1.0
    motion: waypoint_loop
    motion_params:
      speed_m_s: 0.07
      waypoints:
        - [-3.5, 1.8]
        - [-1.0, 3.4]
        - [-2.3, 4.4]
  - id: P2_linear_east
    xy: [4.5, -2.8]
    amplitude: 24.0
    sigma_m: 0.9
    motion: linear
    motion_params: {vx: -0.025, vy: 0.0}
  - id: P3_static_south
    xy: [-6.0, -5.0]
    amplitude: 19.0
    sigma_m: 0.85
    motion: static
  - id: P4_circular_north
    xy: [1.5, 5.0]
    amplitude: 23.0
    sigma_m: 0.9
    motion: circular
    motion_params: {center_x: 1.5, center_y: 5.0, radius: 0.8, angular_speed: 0.08}
  - id: P5_intermittent_west
    xy: [-9.0, 3.5]
    amplitude: 21.0
    sigma_m: 0.9
    motion: appear_disappear
    motion_params: {period_s: 60.0, duty_cycle: 0.7, phase_s: 5.0}
