# Complete software stack. Empirical calibration and Pi 5 timing remain unverified.
sensor_node:
  ros__parameters:
    camera_hfov_deg: 57.0
    camera_height_m: 0.6
    camera_pitch_rad: 0.0
    camera_yaw_rad: 0.0
    camera_roll_rad: 0.0
    camera_offset_x_m: 0.0
    camera_offset_y_m: 0.0
    surface_height_m: 0.8
    surface_diameter_m: 0.3
    # B only: absolute surface Celsius, drawn once per source and run seed.
    # Overrides scenario amplitudes for B. Omit to use [28.0, 37.0].
    source_temperature_range_c: [28.0, 37.0]
    surface_shape: box
    surface_hot_faces: [-1]
    surface_emissivity: 0.95
    surface_far_m: 15.0
    surface_noise_std_c: 0.15
    surface_bias_c: 0.0
    surface_bias_drift_c_s: 0.001
    surface_emissivity_std: 0.01
    surface_depth_noise_std_m: 0.01
    surface_dropout_probability: 0.0
thermal_mapper_node:
  ros__parameters:
    camera_hfov_deg: 57.0
    camera_height_m: 0.6
    camera_pitch_rad: 0.0
    camera_yaw_rad: 0.0
    camera_roll_rad: 0.0
    camera_offset_x_m: 0.0
    camera_offset_y_m: 0.0
    depth_sync_tolerance_s: 0.06
    projection_near_m: 0.15
    projection_far_m: 15.0
    pose_from_tf: false
source_tracker_node:
  ros__parameters:
    update_rate: 2.0
    position_noise_std: 0.05
    measurement_variance: 0.15
    association_gate_chi2: 9.21
    max_tracks: 32
    slow_prior_enabled: true
    slow_timeout_s: 3.0
belief_node:
  ros__parameters:
    mode: online
    update_rate: 1.0
    ambient_temp: 22.0
    freshness_s: 1.5
    position_noise_std: 0.05
    measurement_variance: 0.2
    budget_ms: 100.0
    field_fit_radius_m: 3.0
    sigma_min_m: 0.25
    sigma_max_m: 3.0
controller_node:
  ros__parameters:
    slow_timeout_s: 3.0
    residual_enabled: true
    posterior_information_weight: 1.0
    # Observation assumptions used by the information-gain planner.
    posterior_detection_probability: 0.85
    posterior_false_alarm_probability: 0.03
    posterior_measurement_variance: 0.2
    surface_standoff_m: 1.2
    surface_robot_radius_m: 0.35
    surface_approach_speed: 0.2
    surface_confirm_hold_s: 1.0
    surface_approach_timeout_s: 20.0
    surface_retry_cooldown_s: 20.0
    surface_source_max_age_s: 1.5
    exploration_goal_timeout_s: 45.0
    exploration_arrival_m: 0.6
    residual_waypoint_min_d: 1.5
    exploration_stall_s: 12.0
    exploration_retry_s: 45.0
    exploration_failed_radius_m: 2.0
    exploration_turn_weight: 0.25
    camera_sweep_speed_rad_s: 0.55
    camera_sweep_distance_m: 4.0
    camera_sweep_interval_s: 60.0
    thermal_image_width: 64
    thermal_image_height: 48
    thermal_fov_x_m: 4.0
    thermal_fov_y_m: 3.0
    gp_max_samples: 64
    gp_max_candidates: 256
    gp_length_scale_m: 2.0
    gp_beta: 2.0
    gp_signal_std_c: 12.0
    gp_noise_std_c: 1.0
    gp_travel_weight: 0.2
