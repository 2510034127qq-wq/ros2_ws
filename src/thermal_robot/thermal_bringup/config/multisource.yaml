# Complete software stack. Empirical calibration and Pi 5 timing remain unverified.
sensor_node:
  ros__parameters:
    camera_hfov_deg: 57.0
    camera_height_m: 0.6
    camera_pitch_rad: 0.0
    camera_yaw_rad: 0.0
    camera_roll_rad: 0.0
    camera_offset_x_m: 0.0
    camera_offset_y_m: 0.0
    surface_height_m: 1.2
    surface_diameter_m: 0.6
    surface_shape: box
    surface_hot_faces: [-1]
    surface_emissivity: 0.95
    surface_far_m: 15.0
    surface_noise_std_c: 0.15
    surface_bias_c: 0.0
    surface_bias_drift_c_s: 0.001
    surface_emissivity_std: 0.01
    surface_depth_noise_std_m: 0.01
    surface_dropout_probability: 0.0
thermal_mapper_node:
  ros__parameters:
    camera_hfov_deg: 57.0
    camera_height_m: 0.6
    camera_pitch_rad: 0.0
    camera_yaw_rad: 0.0
    camera_roll_rad: 0.0
    camera_offset_x_m: 0.0
    camera_offset_y_m: 0.0
    depth_sync_tolerance_s: 0.06
    projection_near_m: 0.15
    projection_far_m: 15.0
    pose_from_tf: false
source_tracker_node:
