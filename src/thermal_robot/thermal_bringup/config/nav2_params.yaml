# =============================================================================
# nav2_params.yaml — Nav2 完整配置（热导航专用）
# =============================================================================
# 机器人参数:
#   差速驱动, 圆柱体 r=0.20m
#   max_linear_vel: 0.25 m/s
#   max_angular_vel: 0.5 rad/s
#
# 热导航特化设计:
#   xy_goal_tolerance: 1.5m（热导航不需要厘米精度，到达热场附近即可）
#   inflation_radius: 0.5m（略大于机器人半径0.22m，留有安全余量）
#   allow_unknown: true（全局规划允许穿越未建图区域，适合大范围热搜索）
#
# 控制器选择: RegulatedPurePursuitController
#   专为差速驱动设计，速度平滑，旋转时减速
#   解决了 v26-v29 中 _drive_toward_yaw 的低效旋转问题
#
# 实机切换：将所有 use_sim_time: false 改为 true 即可（如果ROS2时钟同步启用）
#
# Ref: Macenski 2020 DOI:10.1109/IROS45743.2020.9341207 (Nav2)
# =============================================================================

# ── BT Navigator ──────────────────────────────────────────────────────────────
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # [FIX-FINAL] 自定义 BT XML（无 RateController）
    # sim_nav_slam_launch.py 会用 thermal_bringup package share 动态覆盖为
    # 已安装 XML 绝对路径；这里保留可读默认值，避免绑定本机 install 路径。
    default_nav_to_pose_bt_xml: "navigate_to_pose_simple.xml"
    default_nav_through_poses_bt_xml: "navigate_to_pose_simple.xml"
    # 仅加载必要的 BT 节点，减少内存占用
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    # 只保留 ROS2 Humble 标准安装中确实存在的 BT 节点
    # 已移除: nav2_rate_control_bt_node（该 .so 在部分安装中不存在）
    # 已移除: nav2_is_stuck_condition_bt_node（Humble 中名称不同）
    # 已移除: nav2_initial_pose_received_condition_bt_node（可选，非必须）
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node

# ── Controller Server（局部规划器）────────────────────────────────────────────
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0          # 与热导航 10Hz 一致
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # 进度检测：10s内移动不超过0.5m则认为卡滞
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # 目标到达判断：xy误差<1.5m，yaw误差<0.5rad
    # 热导航不需要精确停靠，大范围到达即可让上层状态机接管
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.5
      yaw_goal_tolerance: 0.5

    # RegulatedPurePursuitController：差速驱动最优控制器
    # 核心优势：自动在弯道减速，避免v26-v29的高曲率震荡
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.22          # 巡航速度（=frontier_nav_lin_vel）
      lookahead_dist: 0.8               # 前视距离
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.2
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.4  # 原地对准角速度（稍低于max 0.5）
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_feedforward_gain: 1.0
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.8
      regulated_linear_scaling_min_speed: 0.10
      use_rotate_to_heading: true       # 到达目标点附近时自动对准
      allow_reversing: false
      rotate_to_heading_min_angle: 0.5  # 偏差>0.5rad 才触发原地旋转
      max_angular_accel: 2.0
      max_robot_pose_search_dist: 10.0

# ── Planner Server（全局规划器）──────────────────────────────────────────────
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0    # 全局规划 1Hz（路径不需要频繁更新）
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 1.5                   # 与 goal_checker 一致
      use_astar: true                  # A* 比 Dijkstra 在大地图上更快
      allow_unknown: true              # 允许穿越未建图区域（热搜索必须）

# ── Behavior Server（恢复行为）────────────────────────────────────────────────
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors/Wait"
    use_sim_time: false
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 2.0

# ── Local Costmap（局部代价地图）──────────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.25              # 机器人半径0.20m + 5cm余量
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.50        # 略大于机器人半径
      always_send_full_costmap: true

# ── Global Costmap（全局代价地图）─────────────────────────────────────────────
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      robot_radius: 0.25
      rolling_window: true
      width: 60
      height: 60
      resolution: 0.10
      track_unknown_space: false
      # SLAM Toolbox may publish very small early maps during startup.  A static
      # global layer then shrinks Nav2's costmap around the initial SLAM map and
      # marks the robot out-of-bounds.  The controller already owns global
      # exploration targets, so Nav2 only needs local obstacle/inflation checks
      # over a large rolling map-frame window.
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.50
      always_send_full_costmap: true

# ── Lifecycle Manager（Nav2生命周期管理）──────────────────────────────────────
# 注意：这里只是参数定义。实际的 lifecycle_manager 节点在 launch 文件中启动
# 两个 lifecycle_manager 实例：
#   lifecycle_manager_slam: 管理 slam_toolbox
#   lifecycle_manager_nav: 管理 Nav2 全套节点
